# Nginx config for the FRONTEND container only — serves the built React
# app's static files. This is NOT the reverse proxy that routes /api and
# /uploads to the backend; that's a separate top-level nginx/nginx.conf,
# added in Phase 18, which sits in front of this container.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip static assets — meaningfully smaller JS/CSS payloads for a
    # 50-user audience on varying connection speeds, at near-zero cost.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite fingerprints built assets (e.g. index-a1b2c3d4.js), so these
    # are safe to cache aggressively — a new deploy produces new
    # filenames, never reuses a stale cached one under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any path that isn't a real file on disk (e.g.
    # /products/42, /my-orders/7, a hard refresh on a client-side route)
    # falls back to index.html, letting React Router handle it. Without
    # this, a page refresh on any non-root route would 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache index.html itself — it references the current
    # fingerprinted asset filenames, so a stale cached index.html would
    # point at JS/CSS that may no longer exist after a new deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
